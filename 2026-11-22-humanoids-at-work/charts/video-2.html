<!doctype html>
<!-- Jobs video, 1600x900, 15 s. Bars on a log scale, then a dot grid. Numbers from ../data/summary.json. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg:#FAF8F3; --ink:#1F1C1A; --text:#615B53; --charcoal:#3A3531; --stone:#CBC1B1; --acc:#6F8496; --paper:#F3EFE7; }
  html, body { margin:0; background:var(--bg); } body { width:1600px; height:900px; overflow:hidden; } svg { display:block; }
  text { font-family:'Inter Tight', sans-serif; font-variant-numeric:tabular-nums lining-nums; }
</style></head><body>
<svg id="c" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script>
const C = document.getElementById('c'); let S;
const v = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cl = (x) => Math.max(0, Math.min(1, x)), p = (t, a, b) => cl((t - a) / (b - a));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), out = (x) => 1 - Math.pow(1 - x, 3);
const vis = (t, a, b) => ease(p(t, a, a + 0.6)) * (1 - ease(p(t, b - 0.5, b)));
const fmt = (n) => Math.round(n).toLocaleString('en-US');
window.draw = (t) => {
  const K = { ink: v('--ink'), text: v('--text'), ch: v('--charcoal'), st: v('--stone'), ac: v('--acc') };
  let s = '';
  // 1 · work done, in human working years (0.3–8.4)
  { const a = 0.3, b = 8.4, o = vis(t, a, b); if (o > 0) {
      const x0 = 620, W = 820, lo = 2, hi = 6.5, X = (n) => x0 + W * (Math.log10(n) - lo) / (hi - lo);
      const rows = [['One person, one year', S.full_time_hours_year, K.st, '1 working year'],
        ['Figure 02 at BMW, 2025', S.figure_bmw_hours, K.ac, S.figure_bmw_worker_year_fraction + ' of one'],
        ['Agility Digit, all customers, ever', S.agility_hours, K.ac, S.agility_worker_years + ' working years'],
        ['A car plant of 1,000 people, one year', 2000000, K.st, '1,000 a year']];
      s += `<g opacity="${o}"><text x="140" y="150" font-size="46" font-weight="600" fill="${K.ink}">The best-documented humanoid jobs</text>
        <text x="140" y="200" font-size="28" fill="${K.text}">in human working years (hours ÷ 2,000)</text>`;
      rows.forEach(([lab, n, col, tag], i) => { const k = out(p(t, a + 0.7 + i * 1.1, a + 1.7 + i * 1.1)), y = 290 + i * 130, w = (X(n) - x0) * k;
        s += `<g opacity="${cl(k * 3)}"><text x="${x0 - 24}" y="${y + 40}" font-size="30" text-anchor="end" fill="${K.ink}" ${col === K.ac ? 'font-weight="700"' : ''}>${lab}</text>
          <rect x="${x0}" y="${y}" width="${w}" height="56" rx="6" fill="${col}"/>
          <text x="${i === 3 ? x0 + w - 18 : x0 + w + 18}" y="${y + 40}" font-size="30" font-weight="700" ${i === 3 ? 'text-anchor="end"' : ''} fill="${col === K.ac ? K.ac : K.ink}" opacity="${k}">${tag}</text></g>`; });
      s += `</g>`; } }
  // 2 · 2030 against the world's factory workers (8.5–15)
  { const a = 8.5, o = ease(p(t, a, a + 0.6)) * (1 - ease(p(t, 14.6, 15))); if (o > 0) {
      const n = Math.round(S.factory_workers_per_2030_humanoid), cols = 29, g = 21, x0 = 860, y0 = 230, k = out(p(t, a + 0.6, a + 3.2));
      let d = ''; const shown = Math.round(n * k);
      for (let i = 0; i < shown; i++) { const cx = x0 + (i % cols) * g, cy = y0 + Math.floor(i / cols) * g; d += `<circle cx="${cx}" cy="${cy}" r="8" fill="${i === 0 ? K.ac : K.st}"/>`; }
      const k2 = ease(p(t, a + 3.4, a + 4.0));
      s += `<g opacity="${o}"><text x="140" y="150" font-size="44" font-weight="600" fill="${K.ink}">IDC expects ${fmt(S.idc_2030_units)} humanoids shipped in 2030</text>
        ${d}<g opacity="${k2}"><text x="140" y="330" font-size="34" font-weight="700" fill="${K.ac}">1 dot = those robots</text>
        <text x="140" y="380" font-size="30" fill="${K.text}">the rest = the world’s</text><text x="140" y="420" font-size="30" fill="${K.text}">factory workers (ILO)</text>
        <text x="140" y="560" font-size="56" font-weight="700" fill="${K.ink}">1 for every ${n}</text>
        <text x="140" y="610" font-size="30" fill="${K.text}">even if every one went to a factory</text></g>
        <text x="140" y="830" font-size="24" fill="${K.text}">Figure, Agility S-4/A, IDC, ILO · @con_golias</text></g>`; } }
  C.innerHTML = s;
};
window.ready = Promise.all([fetch('../data/summary.json').then((r) => r.json()), document.fonts.load('700 20px "Inter Tight"')]).then(([a]) => { S = a; window.draw(0); });
</script></body></html>
