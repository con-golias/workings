<!doctype html>
<!-- Animated GIFs for the copyright article (20 Nov 2026), dark plate as the brand-bias GIF. ?g=code|hedge.
     Frames via gif.mjs, assembled with Pillow. Numbers from ../data/summary.json; the quoted statements are verbatim
     from data/registrations.csv (excluded_statement): IBM's most common one (14 registrations) and Sony Pictures
     Television's (40). -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#121416}body{width:1200px;height:675px;overflow:hidden}svg{display:block}
text{font-family:'Inter Tight',sans-serif;font-variant-numeric:tabular-nums lining-nums}
.m{font-family:'JetBrains Mono',monospace}</style></head><body>
<svg id="c" width="1200" height="675" viewBox="0 0 1200 675"></svg>
<script>
const NIGHT='#121416', CARD='#1B1E21', BONE='#F1ECE4', DIM='#8E8880', SL='#6FB4FF', LINE='#33373B', STONE='#CBC1B1';
const g = new URLSearchParams(location.search).get('g') || 'code';
let S;
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const seg = (t, a, b) => ease((t - a) / (b - a));
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fmt = (n) => Number(n).toLocaleString('en-US');
// a record card whose "Material excluded" line types itself out
function record(t, rows, typedKey, t0, t1) {
  let o = `<rect x="120" y="190" width="960" height="270" rx="14" fill="${CARD}" stroke="${LINE}" stroke-width="2"/>`;
  rows.forEach(([k, val, hot], i) => {
    const y = 250 + i * 62;
    let shown = val;
    if (k === typedKey) { const n = Math.round(val.length * Math.max(0, Math.min(1, (t - t0) / (t1 - t0)))); shown = val.slice(0, n); }
    o += `<text x="160" y="${y}" font-size="17" font-weight="600" letter-spacing="1.5" fill="${DIM}">${k.toUpperCase()}</text>`;
    const lines = []; let cur = '';
    shown.split(' ').forEach((w) => { if ((cur + ' ' + w).length > 46) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; });
    lines.push(cur);
    lines.forEach((l, j) => { o += `<text class="m" x="420" y="${y + j * 30}" font-size="22" fill="${hot ? SL : BONE}">${esc(l)}</text>`; });
    if (k === typedKey && t < t1 + 0.6 && Math.floor(t * 3) % 2 === 0) {
      const last = lines[lines.length - 1];
      o += `<rect x="${420 + last.length * 13.2 + 2}" y="${y + (lines.length - 1) * 30 - 20}" width="12" height="24" fill="${SL}"/>`;
    }
  });
  return o;
}
window.draw = (t) => {        // seconds, 0..8
  let o = `<rect width="1200" height="675" fill="${NIGHT}"/>`;
  if (g === 'code') {
    o += `<text x="120" y="92" font-size="22" font-weight="600" letter-spacing="2" fill="${DIM}">A REAL US COPYRIGHT REGISTRATION · IBM · SOFTWARE</text>
      <text x="120" y="146" font-size="40" font-weight="700" letter-spacing="-0.5" fill="${BONE}">${t < 4.2 ? 'What the company leaves out of its claim:' : 'AI-written code: left out of the claim.'}</text>`;
    o += record(t, [['Type of work', 'Computer Files'], ['Claimant', 'International Business Machines Corporation'],
      ['Material excluded', 'Computer program, including Versions, and pre-existing third-party AND AI-generated computer code.', true]], 'Material excluded', 0.8, 3.6);
    if (t > 4.4) {
      const k = seg(t, 4.4, 5.6), C = S.code.orgs_display.slice(0, 3), max = C[0][1];
      o += `<text x="120" y="500" font-size="22" fill="${DIM}" opacity="${seg(t, 4.4, 4.8)}"><tspan font-weight="700" fill="${BONE}">${fmt(S.code.n)}</tspan> software registrations disclaim AI-written code. The most:</text>`;
      C.forEach(([c, n], i) => { const x = 120 + i * 330, w = 250 * n / max * k;
        o += `<text x="${x}" y="552" font-size="22" font-weight="600" fill="${BONE}">${c}</text>
          <rect x="${x}" y="566" width="${Math.max(2, w)}" height="16" rx="4" fill="${SL}"/>
          <text x="${x + w + 12}" y="582" font-size="22" font-weight="700" fill="${BONE}">${Math.round(n * k)}</text>`; });
    }
  } else {
    o += `<text x="120" y="92" font-size="22" font-weight="600" letter-spacing="2" fill="${DIM}">A REAL US COPYRIGHT REGISTRATION · SONY PICTURES TELEVISION · TV EPISODE</text>
      <text x="120" y="146" font-size="40" font-weight="700" letter-spacing="-0.5" fill="${BONE}">${t < 4.2 ? 'Read the excluded material closely:' : 'Not an admission. Insurance.'}</text>`;
    o += record(t, [['Type of work', 'Motion Pictures'], ['Claimant', 'Sony Pictures Television Inc'],
      ['Material excluded', 'preexisting music, Material (if any) generated by AI without sufficient human control.', true]], 'Material excluded', 0.8, 3.6);
    if (t > 3.9) {   // circle "(if any)"
      const k = seg(t, 3.9, 4.6), cx = 420 + 'preexisting music, Material '.length * 13.2 + 54, cy = 367;
      o += `<ellipse cx="${cx}" cy="${cy}" rx="62" ry="22" fill="none" stroke="${STONE}" stroke-width="3" stroke-dasharray="${380 * k} 400" transform="rotate(-4 ${cx} ${cy})"/>`;
    }
    if (t > 4.6) o += `<text x="120" y="520" font-size="24" fill="${DIM}" opacity="${seg(t, 4.6, 5.0)}"><tspan font-weight="700" fill="${BONE}">${S.hedged.n}</tspan> disclaimers hedge like this: “if any”, “may”, “possibly”.</text>
      <text x="120" y="560" font-size="24" fill="${DIM}" opacity="${seg(t, 5.2, 5.6)}"><tspan font-weight="700" fill="${BONE}">${Math.round(S.hedged.org_share)}%</tspan> of them come from organisations.</text>`;
  }
  if (t > 6.0) o += `<text x="120" y="640" font-size="18" fill="${DIM}" opacity="${seg(t, 6.0, 6.4)}">US Copyright Office public records, read 9 Nov 2026. @con_golias</text>`;
  document.getElementById('c').innerHTML = o;
};
window.ready = Promise.all([fetch('../data/summary.json').then((r) => r.json()), document.fonts.load('700 20px "Inter Tight"'),
  document.fonts.load('400 20px "JetBrains Mono"')]).then(([a]) => { S = a; window.draw(0); });
</script></body></html>
