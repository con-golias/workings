<!doctype html>
<!-- Opening video for the Wed 11 Nov X Article (US copyright registrations that disclaim AI material), 1600x900, 14 s.
     Text, lines and rectangles only. Numbers from ../data/summary.json (code/analysis.py). -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg:#FAF8F3; --ink:#1F1C1A; --text:#615B53; --charcoal:#3A3531; --stone:#CBC1B1; --terra:#6F8496; } /* slate blue since 20 Nov (owner: no terracotta) */
  html, body { margin:0; background:var(--bg); } body { width:1600px; height:900px; overflow:hidden; } svg { display:block; }
  text { font-family:'Inter Tight', sans-serif; font-variant-numeric:tabular-nums lining-nums; }
</style>
</head>
<body>
<svg id="c" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script>
const C = document.getElementById('c'); let S;
const v = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cl = (x) => Math.max(0, Math.min(1, x)), p = (t, a, b) => cl((t - a) / (b - a));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), out = (x) => 1 - Math.pow(1 - x, 3);
const vis = (t, a, b) => ease(p(t, a, a + 0.6)) * (1 - ease(p(t, b - 0.5, b)));
const fmt = (n) => Number(n).toLocaleString('en-US');
window.draw = (t) => {
  const K = { ink: v('--ink'), text: v('--text'), ch: v('--charcoal'), st: v('--stone'), te: v('--terra') };
  let s = '';
  // 1 · 1 in N → 1 in M (0.3–4.4 s)
  { const a = 0.3, b = 4.4, o = vis(t, a, b); if (o > 0) {
      const k = out(p(t, a + 1.4, a + 2.6)), n0 = S.by_year['2023'].one_in, n1 = S.last_q_one_in;
      const n = Math.round(n0 + (n1 - n0) * k);
      s += `<g opacity="${o}"><text x="140" y="190" font-size="50" font-weight="600" fill="${K.ink}">Copyright filings that admit AI made part of the work</text>
        <text x="140" y="246" font-size="28" fill="${K.text}">Each one says, in the applicant’s own words, what the AI generated.</text>
        <text x="140" y="520" font-size="190" font-weight="700" fill="${k > 0.98 ? K.te : K.ink}">1 in ${fmt(n)}</text>
        <text x="140" y="610" font-size="38" font-weight="600" fill="${K.text}">${k < 0.5 ? 'of US registrations in 2023' : 'of US registrations in ' + S.last_q.q}</text></g>`; } }
  // shared bar
  const bar = (y, parts, total, k) => { let x = 140, r = ''; const W = 1320; parts.forEach(([n, col]) => { const w = W * n / total * k; r += `<rect x="${x}" y="${y}" width="${Math.max(0, w - 3)}" height="90" rx="6" fill="${col}"/>`; x += W * n / total * k; }); return r; };
  // 2 · books (4.5–8.4 s)
  { const a = 4.5, b = 8.4, o = vis(t, a, b); if (o > 0) {
      const B = S.books, k = out(p(t, a + 0.6, a + 1.8));
      s += `<g opacity="${o}"><text x="140" y="220" font-size="60" font-weight="600" fill="${K.ink}">In books, AI drew the pictures.</text>
        <text x="140" y="280" font-size="28" fill="${K.text}">${fmt(B.n)} book registrations that disclaim AI</text>
        ${bar(380, [[B.images_only, K.te], [B.text, K.ch], [B.n - B.images_only - B.text, K.st]], B.n, k)}
        <text x="160" y="440" font-size="44" font-weight="700" fill="#FFFFFF" opacity="${k}">${Math.round(B.images_only_pct)}%</text>
        <text x="140" y="560" font-size="34" font-weight="600" fill="${K.te}" opacity="${ease(p(t, a + 1.8, a + 2.3))}">AI made only the pictures</text>
        <text x="140" y="610" font-size="30" fill="${K.text}" opacity="${ease(p(t, a + 2.1, a + 2.6))}">${Math.round(B.text_pct)}% say the AI wrote some of the text</text></g>`; } }
  // 3 · songs (8.5–11.9 s)
  { const a = 8.5, b = 11.9, o = vis(t, a, b); if (o > 0) {
      const M = S.songs, k = out(p(t, a + 0.6, a + 1.8));
      s += `<g opacity="${o}"><text x="140" y="220" font-size="60" font-weight="600" fill="${K.ink}">In songs, AI made the music.</text>
        <text x="140" y="280" font-size="28" fill="${K.text}">${fmt(M.n)} music and sound-recording registrations that disclaim AI</text>
        ${bar(380, [[M.music_not_lyrics, K.te], [M.lyrics, K.ch], [M.n - M.music_not_lyrics - M.lyrics, K.st]], M.n, k)}
        <text x="160" y="440" font-size="44" font-weight="700" fill="#FFFFFF" opacity="${k}">${Math.round(100 * M.music_not_lyrics / M.n)}%</text>
        <text x="140" y="560" font-size="34" font-weight="600" fill="${K.te}" opacity="${ease(p(t, a + 1.8, a + 2.3))}">AI made the music, a person wrote the words</text>
        <text x="140" y="610" font-size="30" fill="${K.text}" opacity="${ease(p(t, a + 2.1, a + 2.6))}">${Math.round(M.lyrics_pct)}% say the AI wrote lyrics</text></g>`; } }
  // 4 · close (12.0–14 s)
  { const a = 12.0, o = ease(p(t, a, a + 0.5)) * (1 - ease(p(t, 13.6, 14))); if (o > 0) {
      s += `<g opacity="${o}"><text x="140" y="390" font-size="76" font-weight="600" fill="${K.ink}">People mostly keep the words.</text>
        <text x="140" y="470" font-size="34" fill="${K.te}" opacity="${ease(p(t, a + 0.4, a + 0.9))}">${fmt(S.kept)} registrations in the Copyright Office’s public records</text>
        <text x="140" y="800" font-size="24" fill="${K.text}">US Copyright Office public records, read by Konstantinos Gkolias · @con_golias</text></g>`; } }
  C.innerHTML = s;
};
window.ready = Promise.all([fetch('../data/summary.json').then((r) => r.json()), document.fonts.load('700 20px "Inter Tight"')]).then(([a]) => { S = a; window.draw(0); });
</script>
</body>
</html>
