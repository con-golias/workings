<!doctype html>
<!-- Static figures for the Wed 11 Nov X Article (US copyright registrations that disclaim AI-generated material).
     House plate, 1200x720 (2x). ?fig=1..8|cover. Every number from ../data/summary.json (code/analysis.py).
     Colour meanings, fixed for the whole kit: slate blue (var --terra, kept as the name) = made by AI; charcoal = made by
     people / all other; stone = context. 20 Nov: terracotta replaced by the brand-bias slate (owner, 17 Nov: no terracotta). -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg:#FAF8F3; --ink:#1F1C1A; --text:#615B53; --grid:#E8E3DA; --charcoal:#3A3531; --stone:#CBC1B1; --terra:#6F8496; --paper:#F3EFE7; }
  html, body { margin:0; background:var(--bg); } body { width:1200px; height:720px; overflow:hidden; } svg { display:block; }
  text { font-family:'Inter Tight', sans-serif; font-variant-numeric:tabular-nums lining-nums; }
</style>
</head>
<body>
<svg id="c" width="1200" height="720" viewBox="0 0 1200 720"></svg>
<script>
const C = document.getElementById('c'); const fig = new URLSearchParams(location.search).get('fig') || '1';
const v = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (n) => Number(n).toLocaleString('en-US');
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
let S;
function card(title, note, caption, caption2) {
  return `<rect x="40" y="24" width="1120" height="4" fill="${v('--ink')}"/><line x1="40" x2="1160" y1="630" y2="630" stroke="${v('--ink')}" stroke-width="1"/>
    <text x="40" y="74" font-size="26" font-weight="600" fill="${v('--ink')}">${title}</text>
    <text x="1160" y="74" font-size="20" text-anchor="end" fill="${v('--text')}">${note}</text>
    <text x="40" y="668" font-size="19" fill="${v('--text')}">${caption}</text>
    ${caption2 ? `<text x="40" y="694" font-size="19" fill="${v('--text')}">${caption2}</text>` : ''}`;
}
const dot = (x, y, r, fill) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${v('--ink')}" stroke-width="1.5"/>`;
const SRC = 'US Copyright Office public records, every registration whose own statements disclaim AI-generated material.';

// 1 · AI disclaimers per 10,000 registrations, by quarter
function fig1() {
  const Q = S.by_quarter.filter((q) => q.complete);
  const x0 = 120, W = 980, y0 = 560, H = 380, max = Math.ceil(Math.max(...Q.map((q) => q.per_10k)) / 10) * 10, Y = (n) => H * n / max, bw = W / Q.length;
  let s = card('Registrations that disclaim AI-generated material, per 10,000', 'per 10,000 registrations',
    SRC, `Quarters by registration date, ending ${S.last_full_quarter_label}; later months are still being added. Both counts are drawn from the same catalogue.`);
  for (let g = 0; g <= max; g += max / 4) s += `<line x1="${x0}" x2="${x0 + W}" y1="${y0 - Y(g)}" y2="${y0 - Y(g)}" stroke="${v('--grid')}"/><text x="${x0 - 16}" y="${y0 - Y(g) + 6}" font-size="18" text-anchor="end" fill="${v('--text')}">${g}</text>`;
  let path = '';
  Q.forEach((q, i) => { const cx = x0 + i * bw + bw / 2; path += `${i ? 'L' : 'M'}${cx},${y0 - Y(q.per_10k)}`; });
  s += `<path d="${path}" fill="none" stroke="${v('--terra')}" stroke-width="3"/>`;
  Q.forEach((q, i) => {
    const cx = x0 + i * bw + bw / 2, end = i === Q.length - 1, first = i === 0;
    s += dot(cx, y0 - Y(q.per_10k), end || first ? 11 : 7, v('--terra'));
    if (end || first) s += `<text x="${cx}" y="${y0 - Y(q.per_10k) - 24}" font-size="22" font-weight="700" text-anchor="middle" fill="${v('--ink')}">${q.per_10k}</text>`;
    if (q.q.endsWith('Q1')) s += `<text x="${cx}" y="${y0 + 34}" font-size="20" text-anchor="middle" fill="${v('--text')}">${q.q.slice(0, 4)}</text>`;
  });
  const b = Q[Q.length - 1];
  s += `<text x="${x0 + 10}" y="140" font-size="21" fill="${v('--ink')}"><tspan font-weight="700">1 in ${fmt(S.by_year['2023'].one_in)}</tspan> registrations in 2023. <tspan font-weight="700">1 in ${fmt(S.last_q_one_in)}</tspan> in ${b.q}.</text>`;
  return s;
}

// shared: a 100% bar split into parts
function split(y, label, sub, parts, total) {
  const x0 = 300, W = 820; let x = x0, s = `<text x="40" y="${y + 2}" font-size="23" font-weight="600" fill="${v('--ink')}">${label}</text><text x="40" y="${y + 30}" font-size="18" fill="${v('--text')}">${sub}</text>`;
  parts.forEach(([n, col, lab]) => {
    const w = W * n / total;
    s += `<rect x="${x}" y="${y - 26}" width="${Math.max(0, w - 2)}" height="52" rx="4" fill="${col}"/>`;
    if (w > 90) s += `<text x="${x + 14}" y="${y + 8}" font-size="21" font-weight="700" fill="${col === v('--stone') ? v('--ink') : '#FFFFFF'}">${Math.round(100 * n / total)}%</text>`;
    if (lab) s += `<text x="${x + 14}" y="${y + 58}" font-size="18" fill="${v('--text')}">${lab}</text>`;
    x += w;
  });
  return s;
}

// 2 · the mirror: in books AI made the pictures; in songs AI made the music
function fig2() {
  const B = S.books, M = S.songs;
  let s = card('What the AI made, by the applicants’ own account', 'share of registrations',
    `Books: the ${fmt(B.n)} text registrations with an AI disclaimer. Songs: the ${fmt(M.n)} music and sound-recording registrations.`,
    'Read from the “material excluded” statement. A registration can exclude more than one thing; the rest name no part.');
  s += split(220, 'Books', `${fmt(B.n)} registrations`, [[B.images_only, v('--terra'), 'AI made only the pictures'], [B.text, v('--charcoal'), 'AI wrote some text'], [B.n - B.images_only - B.text, v('--stone'), '']], B.n);
  s += split(420, 'Songs', `${fmt(M.n)} registrations`, [[M.music_not_lyrics, v('--terra'), 'AI made the music, not the words'], [M.lyrics, v('--charcoal'), 'AI wrote lyrics'], [M.n - M.music_not_lyrics - M.lyrics, v('--stone'), '']], M.n);
  return s;
}

// 3 · rate by type of work
function fig3() {
  const rows = S.by_type.filter((r) => r.ai >= 20);
  const x0 = 470, W = 560, max = Math.max(...rows.map((r) => r.per_10k)), X = (n) => x0 + W * n / max, rh = 62, y1 = 140;
  let s = card('How often each kind of work disclaims AI', 'per 10,000 registrations',
    `Registrations dated 1 Jan 2025 to the catalogue’s latest, by the Office’s type of work. Types with fewer than 20 AI disclaimers left out.`,
    `Computer files include online courses: one company, Pluralsight, has ${S.computer_files_without_top.top_n} of them. Without it: ${S.computer_files_without_top.per_10k} per 10,000.`);
  rows.forEach((r, i) => {
    const y = y1 + i * rh, key = i === 0;
    s += `<text x="${x0 - 22}" y="${y + 7}" font-size="21" text-anchor="end" fill="${v('--ink')}">${esc(r.type)}</text>
      <line x1="${x0}" x2="${X(r.per_10k)}" y1="${y}" y2="${y}" stroke="${v('--terra')}" stroke-width="4" stroke-linecap="round"/>
      ${dot(X(r.per_10k), y, 10, v('--terra'))}<text x="${X(r.per_10k) + 20}" y="${y + 7}" font-size="21" font-weight="700" fill="${v('--ink')}">${r.per_10k}</text>
      <text x="${X(r.per_10k) + 20}" y="${y + 30}" font-size="16" fill="${v('--text')}">${fmt(r.ai)} of ${fmt(r.total)}</text>`;
  });
  return s;
}

// 4 · who files: the organisations with the most AI disclaimers
function fig4() {
  const rows = S.top_orgs_display.slice(0, 8);
  const x0 = 420, W = 600, max = rows[0][1], X = (n) => x0 + W * n / max, rh = 56, y1 = 140;
  let s = card('The organisations that file the most AI disclaimers', 'registrations',
    `All ${fmt(S.kept)} registrations, by claimant. ${fmt(S.claimants_unique)} different claimants; ${S.single_filers_pct}% of them filed exactly one.`,
    `Private individuals are not named; the busiest filed ${S.top_individual_counts[0]} and ${S.top_individual_counts[1]}.`);
  rows.forEach(([c, n], i) => {
    const y = y1 + i * rh, key = i === 0;
    s += `<text x="${x0 - 22}" y="${y + 7}" font-size="21" text-anchor="end" fill="${v('--ink')}">${esc(c)}</text>
      <line x1="${x0}" x2="${X(n)}" y1="${y}" y2="${y}" stroke="${v('--charcoal')}" stroke-width="4" stroke-linecap="round"/>
      ${dot(X(n), y, 10, v('--charcoal'))}<text x="${X(n) + 20}" y="${y + 7}" font-size="21" font-weight="700" fill="${v('--ink')}">${n}</text>`;
  });
  return s;
}

// 5 · what the AI made, across every registration
function fig5() {
  const L = { images: 'Images, artwork, illustrations', music: 'Music, vocals, sound', text: 'Text', video: 'Video, animation, footage', 'narration / voice': 'Narration, voice-over', code: 'Computer code', lyrics: 'Lyrics', 'not said': 'Not said ("AI-generated material")' };
  const rows = Object.entries(S.parts).sort((a, b) => b[1].n - a[1].n);
  const x0 = 470, W = 560, max = rows[0][1].pct, X = (n) => x0 + W * n / max, rh = 56, y1 = 135;
  let s = card('What applicants say the AI made', '% of registrations',
    `The ${fmt(S.parts_n)} registrations with an AI phrase in the “material excluded” statement. One registration can name several parts.`);
  rows.forEach(([k, r], i) => {
    const y = y1 + i * rh, muted = k === 'not said';
    s += `<text x="${x0 - 22}" y="${y + 7}" font-size="21" text-anchor="end" fill="${muted ? v('--text') : v('--ink')}">${L[k] || k}</text>
      <line x1="${x0}" x2="${X(r.pct)}" y1="${y}" y2="${y}" stroke="${muted ? v('--stone') : v('--terra')}" stroke-width="4" stroke-linecap="round"/>
      ${dot(X(r.pct), y, 10, muted ? v('--stone') : v('--terra'))}<text x="${X(r.pct) + 20}" y="${y + 7}" font-size="21" font-weight="700" fill="${v('--ink')}">${r.pct}%</text>`;
  });
  return s;
}

// 6 · AI code, disclaimed: the companies
function fig6() {
  const rows = S.code.orgs_display.slice(0, 7);
  const x0 = 520, W = 520, max = rows[0][1], X = (n) => x0 + W * n / max, rh = 62, y1 = 150;
  let s = card('Software registrations that disclaim AI-written code', 'registrations',
    `The ${fmt(S.code.n)} registrations whose excluded material names AI-generated code or programs; organisations with the most.`);
  rows.forEach(([c, n], i) => {
    const y = y1 + i * rh;
    s += `<text x="${x0 - 22}" y="${y + 7}" font-size="21" text-anchor="end" fill="${v('--ink')}">${esc(c.replace(/,? (Inc|LLC|Corporation|Limited)\.?$/i, ''))}</text>
      <line x1="${x0}" x2="${X(n)}" y1="${y}" y2="${y}" stroke="${v('--terra')}" stroke-width="4" stroke-linecap="round"/>
      ${dot(X(n), y, 10, v('--terra'))}<text x="${X(n) + 20}" y="${y + 7}" font-size="21" font-weight="700" fill="${v('--ink')}">${n}</text>`;
  });
  return s;
}

// 7 · tools named
function fig7() {
  const rows = S.tools.filter(([, n]) => n >= 3).slice(0, 8);
  const x0 = 360, W = 640, max = rows[0][1], X = (n) => x0 + W * n / max, rh = 54, y1 = 175;
  let s = card('The AI tools applicants name', 'registrations',
    `Any of the three statements. Only ${S.tools_any_pct}% of the ${fmt(S.kept)} registrations name a tool at all; the rest say “AI”.`);
  s += `<text x="40" y="128" font-size="21" fill="${v('--ink')}"><tspan font-weight="700">${fmt(S.tools_any)}</tspan> registrations name a tool. <tspan font-weight="700">${fmt(S.kept - S.tools_any)}</tspan> do not.</text>`;
  rows.forEach(([c, n], i) => {
    const y = y1 + i * rh;
    s += `<text x="${x0 - 22}" y="${y + 7}" font-size="21" text-anchor="end" fill="${v('--ink')}">${esc(c)}</text>
      <line x1="${x0}" x2="${X(n)}" y1="${y}" y2="${y}" stroke="${v('--terra')}" stroke-width="4" stroke-linecap="round"/>
      ${dot(X(n), y, 10, v('--terra'))}<text x="${X(n) + 20}" y="${y + 7}" font-size="21" font-weight="700" fill="${v('--ink')}">${n}</text>`;
  });
  return s;
}

// 8 · where the authors live (outside the US)
function fig8() {
  const rows = S.countries.filter(([c]) => c !== 'United States').slice(0, 9);
  const x0 = 360, W = 640, max = rows[0][1], X = (n) => x0 + W * n / max, rh = 50, y1 = 180;
  let s = card('Where the authors live, outside the United States', 'registrations',
    `Authors’ domicile or citizenship, as stated in ${fmt(S.with_country)} of the registrations. ${S.non_us_pct}% name a country other than the US.`);
  s += `<text x="40" y="130" font-size="21" fill="${v('--ink')}">United States: <tspan font-weight="700">${fmt(S.countries[0][1])}</tspan> registrations. Everyone else:</text>`;
  rows.forEach(([c, n], i) => {
    const y = y1 + i * rh;
    s += `<text x="${x0 - 22}" y="${y + 7}" font-size="21" text-anchor="end" fill="${v('--ink')}">${esc(c)}</text>
      <line x1="${x0}" x2="${X(n)}" y1="${y}" y2="${y}" stroke="${v('--charcoal')}" stroke-width="4" stroke-linecap="round"/>
      ${dot(X(n), y, 9, v('--charcoal'))}<text x="${X(n) + 20}" y="${y + 7}" font-size="21" font-weight="700" fill="${v('--ink')}">${n}</text>`;
  });
  return s;
}

// Cover (20 Nov, dark plate as the brand-bias cover): the only time series in the data, AI disclaimers per 10,000
// registrations by complete quarter, drawn as one glowing curve; the title and the end value are the only words.
function cover() {
  const Q = S.by_quarter.filter((q) => q.complete);
  const NIGHT = '#121416', BONE = '#F1ECE4', DIM = '#8E8880', LINE = '#2A2D30', SL = '#6FB4FF';
  const x0 = 110, x1 = 1170, yB = 560, yT = 250, max = Math.max(...Q.map((q) => q.per_10k));
  const X = (i) => x0 + (x1 - x0) * i / (Q.length - 1), Y = (n) => yB - (yB - yT) * n / max;
  // smooth curve through the quarters (Catmull-Rom → cubic Bézier)
  const pts = Q.map((q, i) => [X(i), Y(q.per_10k)]);
  let d = `M ${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C ${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
  }
  const end = pts[pts.length - 1];
  let o = `<defs>
      <linearGradient id="cg" gradientUnits="userSpaceOnUse" x1="${x0}" x2="${x1}" y1="0" y2="0"><stop offset="0" stop-color="${SL}" stop-opacity="0.25"/><stop offset="1" stop-color="${SL}" stop-opacity="1"/></linearGradient>
      <linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${SL}" stop-opacity="0.22"/><stop offset="1" stop-color="${SL}" stop-opacity="0"/></linearGradient>
      <radialGradient id="glow"><stop offset="0" stop-color="${SL}" stop-opacity="0.6"/><stop offset="1" stop-color="${SL}" stop-opacity="0"/></radialGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
    </defs>
    <rect width="1500" height="600" fill="${NIGHT}"/>`;
  [0.25, 0.5, 0.75, 1].forEach((g) => { o += `<line x1="${x0}" x2="${x1}" y1="${Y(max * g)}" y2="${Y(max * g)}" stroke="${LINE}" stroke-width="1.5"/>`; });
  o += `<line x1="${x0}" x2="${x1}" y1="${yB}" y2="${yB}" stroke="#3A3D40" stroke-width="2"/>
    <path d="${d} L ${end[0]},${yB} L ${x0},${yB} Z" fill="url(#fill)"/>
    <path d="${d}" fill="none" stroke="${SL}" stroke-width="14" opacity="0.35" filter="url(#blur)"/>
    <path d="${d}" fill="none" stroke="url(#cg)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="${end[0]}" cy="${end[1]}" r="110" fill="url(#glow)"/>
    <circle cx="${end[0]}" cy="${end[1]}" r="17" fill="${SL}"/>
    <circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="9" fill="${NIGHT}" stroke="${DIM}" stroke-width="3"/>
    <text x="${end[0] + 36}" y="${end[1] + 2}" font-size="54" font-weight="700" letter-spacing="-1" fill="${BONE}">1 in ${fmt(S.last_q_one_in)}</text>
    <text x="${end[0] + 38}" y="${end[1] + 40}" font-size="21" fill="${DIM}">US copyright filings</text>
    <text x="${end[0] + 38}" y="${end[1] + 66}" font-size="21" fill="${DIM}">now disclaim an AI part</text>
    <text x="${pts[0][0]}" y="${yB + 34}" font-size="22" fill="${DIM}">2023</text>
    <text x="${end[0]}" y="${yB + 34}" font-size="22" text-anchor="middle" fill="${DIM}">2026</text>
    <g id="marker"></g>
    <text id="ttl" x="110" y="128" font-size="72" font-weight="700" letter-spacing="-1.8" fill="${BONE}">Made by AI. Owned by<tspan id="hl" dx="22" fill="${NIGHT}">no one.</tspan></text>`;
  return o;
}
// Hand-drawn highlighter swipe behind "no one." (as the brand-bias cover's "your name").
function coverMarker() {
  const t = document.getElementById('ttl'), full = t.textContent, i0 = full.indexOf('no one.'), i1 = i0 + 'no one.'.length - 1;
  const a = t.getExtentOfChar(i0), b = t.getExtentOfChar(i1);
  const x0 = a.x - 16, x1 = b.x + b.width + 18, yT = a.y + a.height * 0.16, yB = a.y + a.height * 0.97, tilt = 6;
  const d = `M ${x0 + 8},${yT + tilt + 2} Q ${(x0 + x1) / 2},${yT + tilt / 2 - 5} ${x1 - 4},${yT - 1}
    Q ${x1 + 12},${(yT + yB) / 2 - tilt / 2} ${x1 - 2},${yB - tilt + 2} Q ${(x0 + x1) / 2},${yB - tilt / 2 + 6} ${x0 + 2},${yB + 3}
    Q ${x0 - 12},${(yT + yB) / 2 + tilt / 2} ${x0 + 8},${yT + tilt + 2} Z`;
  document.getElementById('marker').innerHTML = `<path d="${d}" fill="#6FB4FF" opacity="0.96"/>
    <path d="M ${x0 + 14},${yT + tilt + 6} Q ${(x0 + x1) / 2},${yT + 1} ${x1 - 16},${yT + 4}" fill="none" stroke="#A8D2FF" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <path d="M ${x0 + 20},${yB - 4} Q ${(x0 + x1) / 2},${yB - 2} ${x1 - 26},${yB - tilt - 6}" fill="none" stroke="#4E97E8" stroke-width="7" stroke-linecap="round" opacity="0.45"/>`;
}
const FIGS = { 1: fig1, 2: fig2, 3: fig3, 4: fig4, 5: fig5, 6: fig6, 7: fig7, 8: fig8, cover };
if (fig === 'cover') { document.body.style.width = '1500px'; document.body.style.height = '600px'; C.setAttribute('width', 1500); C.setAttribute('height', 600); C.setAttribute('viewBox', '0 0 1500 600'); }
window.ready = Promise.all([fetch('../data/summary.json').then((r) => r.json()), document.fonts.load('400 20px "Inter Tight"'), document.fonts.load('700 20px "Inter Tight"')])
  .then(([a]) => { S = a; C.innerHTML = FIGS[fig](); if (fig === 'cover') coverMarker(); });
</script>
</body>
</html>
